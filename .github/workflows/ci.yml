name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate content manifest
        run: npm run content:manifest

      # The premium payload is what the Edge Function serves. Building it here
      # means the protected-content tests run against a real artifact, and that a
      # content change which would leave a Pro item unserveable fails CI.
      - name: Build premium payload
        run: npm run content:premium

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Audit content
        run: npm run content:audit

      - name: Verify reference solutions
        run: npm run content:verify

      - name: Verify runnable examples
        run: npm run content:examples

      - name: Build production bundle
        run: npm run build

      # The build strips the paid half of Pro content. Re-running the delivery
      # tests against the freshly built dist proves the bundle that would ship
      # carries no Pro solutions, not merely that the stripper was configured.
      - name: Verify the built bundle withholds premium content
        run: npx vitest run src/tests/premium-delivery.test.js
