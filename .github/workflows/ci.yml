name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate content manifest
        run: npm run content:manifest

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Audit content
        run: npm run content:audit

      - name: Verify reference solutions
        run: npm run content:verify

      - name: Verify runnable examples
        run: npm run content:examples

      - name: Build production bundle
        run: npm run build
