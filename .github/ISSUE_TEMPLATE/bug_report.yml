name: Bug report
description: Report a reproducible problem in JSPath
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve JSPath. Please provide enough detail to reproduce the issue.

  - type: input
    id: route
    attributes:
      label: Page / route
      description: Where did the issue occur?
      placeholder: /curriculum, /projects, /reference/...
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Device / operating system
      placeholder: Windows 11, macOS, Android, iOS...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste relevant errors or warnings. Do not include secrets.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots or any other useful details.

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have checked that this issue has not already been reported.
          required: true
        - label: I have not included passwords, API keys, tokens, or private data.
          required: true
