name: Feature suggestion
description: Suggest an improvement to the JSPath learning experience
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Submitting an idea does not create any ownership or licensing rights in JSPath.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What learner or product problem would this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the feature or change.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Why would this improve JSPath?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have checked for an existing issue covering this suggestion.
          required: true
        - label: I understand that implementation decisions remain with the repository owner.
          required: true
